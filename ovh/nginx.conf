# This file is mounted as /etc/nginx/conf.d/default.conf in the stock nginx
# image. It contains http-context directives only; the image nginx.conf owns
# the user/events/http wrapper and MIME configuration.

    # Nginx Proxy Manager is the only permitted ingress to nav-web. NPM appends
    # the actual peer to the XFF chain; nav-web must preserve that normalized
    # chain instead of appending its Docker address a second time.
    map $http_x_forwarded_for $nav_forwarded_for {
        "" $remote_addr;
        ~^\s*$ $remote_addr;
        default $http_x_forwarded_for;
    }

    map $http_x_real_ip $nav_real_ip {
        "" $remote_addr;
        ~^\s*$ $remote_addr;
        default $http_x_real_ip;
    }

    map $http_x_forwarded_proto $nav_forwarded_proto {
        ~*^https$ https;
        ~*^http$ http;
        default $scheme;
    }

    map $http_upgrade $nav_connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 12m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            return 200 'ok\n';
        }

        location ^~ /api/ {
            proxy_pass http://nav-api:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $nav_real_ip;
            proxy_set_header X-Forwarded-For $nav_forwarded_for;
            proxy_set_header X-Forwarded-Proto $nav_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $nav_connection_upgrade;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "private, no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Public share HTML is generated by the API. It follows the same proxy
        # chain rules and must never be stored by a shared or browser cache.
        location ^~ /share/ {
            proxy_pass http://nav-api:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $nav_real_ip;
            proxy_set_header X-Forwarded-For $nav_forwarded_for;
            proxy_set_header X-Forwarded-Proto $nav_forwarded_proto;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            proxy_hide_header Cache-Control;
            proxy_hide_header Referrer-Policy;
            add_header Cache-Control "private, no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        # Vite emits content-hashed files under /assets. A release never
        # overwrites an existing hash, so these objects are safe to cache for a
        # year. Missing assets must be 404 rather than the SPA shell.
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location = /manifest.webmanifest {
            try_files $uri =404;
            default_type application/manifest+json;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location = /service-worker.js {
            try_files $uri =404;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location = /sw.js {
            try_files $uri =404;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location = / {
            try_files /index.html =404;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location = /index.html {
            try_files $uri =404;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location ~* \.html$ {
            try_files $uri =404;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
