<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171310">
  <title>DOMO NAV · 离线</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#171310;color:#f4eee8}
    body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;box-sizing:border-box}
    main{width:min(460px,100%);padding:32px;box-sizing:border-box;background:#2a211d;border:1px solid #493b34;border-radius:24px;box-shadow:0 24px 80px #0007}
    h1{margin:0 0 10px;font-size:24px}p{margin:0 0 22px;color:#cbbdb2;line-height:1.7}
    button{min-height:44px;padding:11px 18px;color:#fff;background:#a08060;border:0;border-radius:14px;font:inherit;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1>当前处于离线状态</h1>
    <p>DOMO NAV 已保留应用外壳，但不会缓存账号数据、笔记、图片或 API 响应。恢复网络后即可安全重新连接。</p>
    <button type="button" onclick="location.reload()">重新连接</button>
  </main>
</body>
</html>
