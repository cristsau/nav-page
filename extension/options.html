<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOMO NAV 扩展设置</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="page">
      <section class="card">
        <div class="hero">
          <img class="hero__avatar" src="./assets/domo-logo.png" alt="DOMO NAV">
          <div>
            <div class="hero__eyebrow">DOMO NAV</div>
            <h1>扩展设置</h1>
            <p class="desc">设置你的 DOMO NAV 站点地址。扩展只申请该站点的访问权限，并复用浏览器登录会话。</p>
          </div>
        </div>

        <label class="field">
          <span>DOMO NAV 地址</span>
          <input id="navBaseUrlInput" type="url" placeholder="https://nav.skrskr.net">
        </label>

        <div class="actions">
          <button id="saveBtn" class="primary-btn" type="button">保存</button>
          <button id="openNavBtn" class="secondary-btn" type="button">打开 DOMO NAV</button>
        </div>

        <div id="statusMessage" class="status" role="status" aria-live="polite"></div>
        <footer class="footer">Design by CrisTsau</footer>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
