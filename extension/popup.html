<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAV Quick Add</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <div>
          <h1>NAV 快速添加</h1>
          <p id="navBaseUrlText"></p>
          <p id="authStatusText" class="auth-status"></p>
        </div>
        <button id="openOptionsBtn" class="link-btn">设置</button>
      </header>

      <section class="card">
        <label class="field">
          <span>页面标题</span>
          <input id="titleInput" type="text">
        </label>
        <label class="field">
          <span>页面地址</span>
          <input id="urlInput" type="url">
        </label>
        <label class="field">
          <span>分组</span>
          <select id="groupSelect"></select>
        </label>
        <div class="inline-row">
          <input id="newGroupInput" type="text" placeholder="快速创建分组">
          <button id="createGroupBtn" class="secondary-btn">新建分组</button>
        </div>
        <div id="statusMessage" class="status"></div>
        <div class="actions">
          <button id="loginBtn" class="secondary-btn" type="button">打开 NAV 登录</button>
          <button id="saveBtn" class="primary-btn" type="button">添加到 NAV</button>
        </div>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
  </html>
