name: Dropbox backup isolated acceptance
on:
  push:
    branches: ['codex/**', master]
    paths: ['scripts/dropbox/**', 'api/src/lib/dropboxBackupStatus.js', 'api/test/dropboxBackupStatus.test.js', '.github/workflows/dropbox-backup.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dropbox-backup-test-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install standard encryption and disposable PostgreSQL tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y age
          docker pull postgres:16-alpine
      - name: Protocol, policy and failure-path tests
        run: sudo "$(command -v node)" --test --test-concurrency=1 scripts/dropbox/oauth.test.mjs scripts/dropbox/backup.test.mjs scripts/dropbox/local-retention.test.mjs scripts/dropbox/cloud-retention.test.mjs scripts/dropbox/control.test.mjs api/test/dropboxBackupStatus.test.js
      - name: Real age and PostgreSQL isolated restore with synthetic data only
        run: sudo env NAV_DROPBOX_DISPOSABLE_TEST=1 "$(command -v node)" --test scripts/dropbox/backup-linux.test.mjs
      - name: Private Linux controller and encrypted upload store initialization
        run: sudo env NAV_DROPBOX_DISPOSABLE_TEST=1 "$(command -v node)" --test scripts/dropbox/control-linux.test.mjs
      - name: Package public operator source only
        run: |
          git archive --format=tar.gz --prefix=nav-dropbox-backup/ -o nav-dropbox-backup.tar.gz HEAD scripts/dropbox
          sha256sum nav-dropbox-backup.tar.gz > nav-dropbox-backup.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nav-dropbox-backup-source
          path: |
            nav-dropbox-backup.tar.gz
            nav-dropbox-backup.tar.gz.sha256
          retention-days: 14
      # No deployment step, external credentials, secrets, backup data or key upload.
      # The only network-backed storage is a mock. The hosted runner is disposable.
