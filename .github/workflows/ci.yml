name: NAV checks

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - codex/**

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgres://nav:nav_password@127.0.0.1:5432/nav

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nav
          POSTGRES_PASSWORD: nav_password
          POSTGRES_DB: nav
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nav -d nav"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            api/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix app

      - name: Install API dependencies
        run: npm ci --prefix api

      - name: Audit dependencies
        run: |
          npm audit --prefix app --audit-level=moderate
          npm audit --prefix api --audit-level=moderate

      - name: Validate production acceptance shell
        run: |
          bash -n scripts/release/nav-with-ephemeral-admin.sh
          bash -n scripts/release/test-nav-with-ephemeral-admin.sh

      - name: Validate backup and recovery shell
        run: |
          bash -n \
            scripts/nav-backup.sh \
            scripts/nav-restore-rehearsal.sh \
            scripts/nav-restore-latest.sh \
            scripts/nav-restore-cloud-latest.sh \
            scripts/nav-heartbeat.sh \
            scripts/nav-job-failure-notify.sh \
            scripts/install-nav-backup-systemd.sh
          shellcheck --severity=warning \
            scripts/nav-backup.sh \
            scripts/nav-restore-rehearsal.sh \
            scripts/nav-restore-latest.sh \
            scripts/nav-restore-cloud-latest.sh \
            scripts/nav-heartbeat.sh \
            scripts/nav-job-failure-notify.sh \
            scripts/install-nav-backup-systemd.sh

      - name: Validate backup systemd units
        run: |
          sudo install -d -m 0755 /usr/local/sbin /usr/share/doc/domo-nav
          sudo install -m 0750 scripts/nav-backup.sh /usr/local/sbin/nav-backup
          sudo install -m 0750 scripts/nav-restore-rehearsal.sh /usr/local/sbin/nav-restore-rehearsal
          sudo install -m 0750 scripts/nav-restore-latest.sh /usr/local/sbin/nav-restore-latest
          sudo install -m 0750 scripts/nav-restore-cloud-latest.sh /usr/local/sbin/nav-restore-cloud-latest
          sudo install -m 0750 scripts/nav-heartbeat.sh /usr/local/sbin/nav-heartbeat
          sudo install -m 0750 scripts/nav-job-failure-notify.sh /usr/local/sbin/nav-job-failure-notify
          sudo install -m 0644 docs/NAV_BACKUP_RUNBOOK.md /usr/share/doc/domo-nav/NAV_BACKUP_RUNBOOK.md
          sudo systemd-analyze verify ops/systemd/*.service ops/systemd/*.timer

      - name: Exercise production acceptance shell lifecycle
        env:
          NAV_RELEASE_ACCEPTANCE_SHELL_TEST: "true"
        run: |
          sudo env \
            CI="$CI" \
            NAV_RELEASE_ACCEPTANCE_SHELL_TEST="$NAV_RELEASE_ACCEPTANCE_SHELL_TEST" \
            bash scripts/release/test-nav-with-ephemeral-admin.sh

      - name: Apply and verify PostgreSQL migrations
        run: |
          npm run migrate --prefix api
          npm run migrate --prefix api
          npm run verify:migrations --prefix api

      - name: Run API tests
        run: npm test --prefix api

      - name: Reject productivity schema drift
        env:
          NAV_PRODUCTIVITY_SCHEMA_DRIFT_TEST: "true"
        run: node --test api/test/productivitySchemaDrift.integration.test.js

      - name: Build frontend
        run: npm run build --prefix app

  restore-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://nav:nav_password@127.0.0.1:5432/nav_restore_test
      NAV_RESTORE_INTEGRATION_TEST: "true"
      NAV_RATE_LIMIT_KEY_SECRET: nav-restore-ci-only-secret-20260823-rotate
      NAV_LOG_LEVEL: silent
      CORS_ORIGIN: http://localhost:5174
      NAV_IMGBED_BASE_URL: https://pic.integration.test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nav
          POSTGRES_PASSWORD: nav_password
          POSTGRES_DB: nav_restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nav -d nav_restore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci --prefix api

      - name: Apply and verify PostgreSQL migrations
        run: |
          npm run migrate --prefix api
          npm run migrate --prefix api
          npm run verify:migrations --prefix api

      - name: Run isolated data restore exercise
        run: npm run test:restore:integration --prefix api

  maintenance-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://nav:nav_password@127.0.0.1:5432/nav_maintenance_test
      NAV_MAINTENANCE_INTEGRATION_TEST: "true"
      NAV_LOG_LEVEL: silent

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nav
          POSTGRES_PASSWORD: nav_password
          POSTGRES_DB: nav_maintenance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nav -d nav_maintenance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci --prefix api

      - name: Apply and verify PostgreSQL migrations
        run: |
          npm run migrate --prefix api
          npm run migrate --prefix api
          npm run verify:migrations --prefix api

      - name: Run isolated maintenance exercise
        run: npm run test:maintenance:integration --prefix api

  release-acceptance-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://nav:nav_password@127.0.0.1:5432/nav_release_acceptance_test
      NAV_RELEASE_ACCEPTANCE_INTEGRATION_TEST: "true"
      NAV_BACKUP_GATE_INTEGRATION_TEST: "true"
      NAV_RATE_LIMIT_KEY_SECRET: nav-release-acceptance-ci-secret-20260823
      NAV_LOG_LEVEL: silent

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nav
          POSTGRES_PASSWORD: nav_password
          POSTGRES_DB: nav_release_acceptance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nav -d nav_release_acceptance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci --prefix api

      - name: Apply and verify PostgreSQL migrations
        run: |
          npm run migrate --prefix api
          npm run migrate --prefix api
          npm run verify:migrations --prefix api

      - name: Run ephemeral administrator lifecycle exercise
        run: npm run test:release-acceptance:integration --prefix api

      - name: Run canonical backup PostgreSQL gate exercise
        run: |
          sudo env \
            CI="$CI" \
            PATH="$PATH" \
            NODE_ENV="$NODE_ENV" \
            DATABASE_URL="$DATABASE_URL" \
            NAV_BACKUP_GATE_INTEGRATION_TEST="$NAV_BACKUP_GATE_INTEGRATION_TEST" \
            NAV_RATE_LIMIT_KEY_SECRET="$NAV_RATE_LIMIT_KEY_SECRET" \
            npm run test:backup-gate:integration --prefix api
