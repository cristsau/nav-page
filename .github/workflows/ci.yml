name: NAV checks

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - codex/**

permissions:
  contents: read

jobs:
  api-production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build production API image from a fresh base
        run: >-
          docker build
          --pull
          --build-arg NAV_RELEASE_SHA=ci
          --tag nav-api:ci
          api

      - name: Verify Debian and the native semantic runtime
        run: |
          test "$(docker image inspect nav-api:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "ci"
          docker run --rm nav-api:ci sh -eu -c '
            . /etc/os-release
            test "$ID" = "debian"
            getconf GNU_LIBC_VERSION
            node -e "import(\"onnxruntime-node\").then(() => console.log(\"semantic native runtime verified\")).catch((error) => { console.error(error); process.exit(1) })"
          '

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgres://nav:nav_password@127.0.0.1:5432/nav

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nav
          POSTGRES_PASSWORD: nav_password
          POSTGRES_DB: nav
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nav -d nav"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            api/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix app

      - name: Install API dependencies
        run: npm ci --prefix api

      - name: Validate backend Compose worker topology
        env:
          NAV_RELEASE_SHA: ci
          NAV_SECRETS_DIR: /tmp/nav-ci-secrets
          NAV_INTEGRATIONS_DIR: /tmp/nav-ci-integrations
          NAV_POSTGRES_DATA_DIR: /tmp/nav-ci-postgres-data
        run: |
          touch api/.env
          docker compose -f docker-compose.backend.yml config --quiet

      - name: Audit dependencies
        run: |
          npm audit --prefix app --audit-level=moderate
          node .github/scripts/verify-api-audit-policy.mjs

      - name: Validate production acceptance shell
        run: |
          bash -n scripts/release/nav-with-ephemeral-admin.sh
          bash -n scripts/release/test-nav-with-ephemeral-admin.sh
          bash -n scripts/release/accept-mail-workspace.sh
          bash -n scripts/release/prepare-mail-fixture-and-accept.sh
          bash -n scripts/release/check-email-notification-migration.sh
          shellcheck --severity=warning \
            scripts/release/accept-mail-workspace.sh \
            scripts/release/prepare-mail-fixture-and-accept.sh
          shellcheck --severity=warning scripts/release/check-email-notification-migration.sh

      - name: Validate backup and recovery shell
        run: |
          bash -n \
            scripts/nav-backup.sh \
            scripts/nav-restore-rehearsal.sh \
            scripts/nav-restore-latest.sh \
            scripts/nav-restore-cloud-latest.sh \
            scripts/nav-disaster-restore.sh \
            scripts/nav-heartbeat.sh \
            scripts/nav-job-failure-notify.sh \
            scripts/install-nav-backup-systemd.sh \
            scripts/nav-release-link.sh \
            scripts/enable-nav-local-backup-timers.sh \
            scripts/nav-controlled-cleanup.sh
          shellcheck --severity=warning \
            scripts/nav-backup.sh \
            scripts/nav-restore-rehearsal.sh \
            scripts/nav-restore-latest.sh \
            scripts/nav-restore-cloud-latest.sh \
            scripts/nav-disaster-restore.sh \
            scripts/nav-heartbeat.sh \
            scripts/nav-job-failure-notify.sh \
            scripts/install-nav-backup-systemd.sh \
            scripts/nav-release-link.sh \
            scripts/enable-nav-local-backup-timers.sh \
            scripts/nav-controlled-cleanup.sh

      - name: Exercise atomic release links and cleanup dry-run
        run: |
          set -euo pipefail
          test_root="$(mktemp -d)"
          trap 'rm -rf -- "$test_root"' EXIT
          mkdir -p \
            "$test_root/releases/20260827-230000-1111111" \
            "$test_root/releases/20260828-010000-2222222"
          env NAV_STACK_ROOT="$test_root" NAV_RELEASE_LOCK_FILE="$test_root/release.lock" \
            bash scripts/nav-release-link.sh switch "$test_root/releases/20260827-230000-1111111"
          env NAV_STACK_ROOT="$test_root" NAV_RELEASE_LOCK_FILE="$test_root/release.lock" \
            bash scripts/nav-release-link.sh switch "$test_root/releases/20260828-010000-2222222"
          test "$(readlink -f "$test_root/current")" = "$test_root/releases/20260828-010000-2222222"
          test "$(readlink -f "$test_root/rollback")" = "$test_root/releases/20260827-230000-1111111"
          env NAV_STACK_ROOT="$test_root" NAV_RELEASE_LOCK_FILE="$test_root/release.lock" \
            bash scripts/nav-release-link.sh rollback
          test "$(readlink -f "$test_root/current")" = "$test_root/releases/20260827-230000-1111111"
          test "$(readlink -f "$test_root/rollback")" = "$test_root/releases/20260828-010000-2222222"
          env NAV_STACK_ROOT="$test_root" \
            bash scripts/nav-controlled-cleanup.sh --dry-run --release-min-age-days 0

      - name: Preserve releases backing running and stopped container bind mounts
        run: |
          set -euo pipefail
          test_root="$(mktemp -d)"
          trap 'rm -rf -- "$test_root"' EXIT
          fake_bin="$test_root/fake-bin"
          mkdir -p "$fake_bin" \
            "$test_root/releases/20260827-230000-1111111" \
            "$test_root/releases/20260828-010000-2222222" \
            "$test_root/releases/20260825-010000-3333333" \
            "$test_root/releases/20260825-020000-4444444" \
            "$test_root/releases/20260825-030000-5555555"
          ln -s "$test_root/releases/20260828-010000-2222222" "$test_root/current"
          ln -s "$test_root/releases/20260827-230000-1111111" "$test_root/rollback"
          touch -d '3 days ago' "$test_root/releases"/*
          cat > "$fake_bin/docker" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$1" == ps && "$2" == -aq ]]; then
            printf '%s\n' running-container stopped-container
          elif [[ "$1" == inspect && "$2" == --format && "$3" == *'.Mounts'* ]]; then
            printf '%s\n%s\n' "$RUNNING_BIND_SOURCE" "$STOPPED_BIND_SOURCE"
          elif [[ "$1" == inspect && "$2" == --format ]]; then
            printf '%s\n%s\n' sha256:running sha256:stopped
          elif [[ "$1" == image && "$2" == ls ]]; then
            exit 0
          else
            printf 'unexpected fake docker invocation: %q ' "$@" >&2
            exit 97
          fi
          EOF
          chmod 0755 "$fake_bin/docker"
          running_release="$test_root/releases/20260825-010000-3333333"
          stopped_release="$test_root/releases/20260825-020000-4444444"
          removable_release="$test_root/releases/20260825-030000-5555555"
          cleanup_output="$(
            env \
              PATH="$fake_bin:$PATH" \
              NAV_STACK_ROOT="$test_root" \
              RUNNING_BIND_SOURCE="$running_release/frontend-dist" \
              STOPPED_BIND_SOURCE="$stopped_release/secrets" \
              bash scripts/nav-controlled-cleanup.sh \
                --dry-run --release-min-age-days 0 2>&1
          )"
          grep -Fq "preserve container-bound release: $running_release" <<< "$cleanup_output"
          grep -Fq "preserve container-bound release: $stopped_release" <<< "$cleanup_output"
          grep -Fq "release candidate: $removable_release" <<< "$cleanup_output"
          ! grep -Fq "release candidate: $running_release" <<< "$cleanup_output"
          ! grep -Fq "release candidate: $stopped_release" <<< "$cleanup_output"
          ! grep -Fq "release candidate: $(readlink -f "$test_root/current")" <<< "$cleanup_output"
          ! grep -Fq "release candidate: $(readlink -f "$test_root/rollback")" <<< "$cleanup_output"
          test -d "$running_release"
          test -d "$stopped_release"
          test -d "$removable_release"
          test -d "$(readlink -f "$test_root/current")"
          test -d "$(readlink -f "$test_root/rollback")"

      - name: Validate backup systemd units
        run: |
          sudo install -d -m 0755 /usr/local/sbin /usr/share/doc/domo-nav
          sudo install -m 0750 scripts/nav-backup.sh /usr/local/sbin/nav-backup
          sudo install -m 0750 scripts/nav-restore-rehearsal.sh /usr/local/sbin/nav-restore-rehearsal
          sudo install -m 0750 scripts/nav-restore-latest.sh /usr/local/sbin/nav-restore-latest
          sudo install -m 0750 scripts/nav-restore-cloud-latest.sh /usr/local/sbin/nav-restore-cloud-latest
          sudo install -m 0750 scripts/nav-disaster-restore.sh /usr/local/sbin/nav-disaster-restore
          sudo install -m 0750 scripts/nav-heartbeat.sh /usr/local/sbin/nav-heartbeat
          sudo install -m 0750 scripts/nav-job-failure-notify.sh /usr/local/sbin/nav-job-failure-notify
          sudo install -m 0750 scripts/nav-release-link.sh /usr/local/sbin/nav-release-link
          sudo install -m 0750 scripts/enable-nav-local-backup-timers.sh /usr/local/sbin/enable-nav-local-backup-timers
          sudo install -m 0750 scripts/nav-controlled-cleanup.sh /usr/local/sbin/nav-controlled-cleanup
          sudo install -m 0644 docs/NAV_BACKUP_RUNBOOK.md /usr/share/doc/domo-nav/NAV_BACKUP_RUNBOOK.md
          sudo systemd-analyze verify ops/systemd/*.service ops/systemd/*.timer

      - name: Exercise production acceptance shell lifecycle
        env:
          NAV_RELEASE_ACCEPTANCE_SHELL_TEST: "true"
        run: |
          sudo env \
            CI="$CI" \
            NAV_RELEASE_ACCEPTANCE_SHELL_TEST="$NAV_RELEASE_ACCEPTANCE_SHELL_TEST" \
            bash scripts/release/test-nav-with-ephemeral-admin.sh

      - name: Apply and verify PostgreSQL migrations
        run: |
          npm run migrate --prefix api
          npm run migrate --prefix api
          npm run verify:migrations --prefix api

      - name: Run API tests
        run: npm test --prefix api

      - name: Reject productivity schema drift
        env:
          NAV_PRODUCTIVITY_SCHEMA_DRIFT_TEST: "true"
        run: node --test api/test/productivitySchemaDrift.integration.test.js

      - name: Reject advanced feature schema drift
        env:
          NAV_ADVANCED_FEATURES_SCHEMA_DRIFT_TEST: "true"
        run: node --test api/test/advancedFeaturesSchemaDrift.integration.test.js

      - name: Reject realtime collaboration schema drift
        env:
          NAV_COLLABORATION_REALTIME_SCHEMA_DRIFT_TEST: "true"
        run: node --test api/test/collaborationRealtimeSchemaDrift.integration.test.js

      - name: Build frontend
        run: npm run build --prefix app

