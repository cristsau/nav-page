name: Temporary NAV lockfile refresh

on:
  push:
    branches:
      - codex/nav-collaboration-offline-20260824

permissions:
  contents: read

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Refresh API lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --prefix api

      - name: Refresh frontend lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --prefix app

      - name: Upload lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: nav-lockfiles-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            api/package-lock.json
            app/package-lock.json
