x-nav-logging: &nav-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  nav-postgres:
    image: postgres:16-alpine
    container_name: nav-postgres
    restart: unless-stopped
    logging: *nav-logging
    environment:
      POSTGRES_DB: nav
      POSTGRES_USER: nav
      POSTGRES_PASSWORD: nav_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - type: bind
        source: "${NAV_POSTGRES_DATA_DIR:?set NAV_POSTGRES_DATA_DIR to an absolute persistent directory outside the release tree}"
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nav -d nav"]
      interval: 10s
      timeout: 5s
      retries: 10

  nav-api:
    image: "domo-nav-api:${NAV_RELEASE_SHA:-development}"
    build:
      context: ./api
      args:
        NAV_RELEASE_SHA: "${NAV_RELEASE_SHA:-development}"
    container_name: nav-api
    restart: unless-stopped
    logging: *nav-logging
    depends_on:
      nav-postgres:
        condition: service_healthy
    env_file:
      - ./api/.env
    environment:
      NODE_ENV: production
      NAV_EMAIL_RUNTIME_ROLE: api
      NAV_MANAGED_INTEGRATIONS_DIR: "${NAV_INTEGRATIONS_DIR:-/etc/nav/integrations}"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - /home/web/html/nav:/var/www/nav:ro
      - "${NAV_SECRETS_DIR:?set NAV_SECRETS_DIR to the release-local secrets directory}/cliproxy-api-key:/run/secrets/nav/cli-proxy-api-key:ro"
      - "${NAV_SECRETS_DIR:?set NAV_SECRETS_DIR to the release-local secrets directory}/imgbed-library-token:/run/secrets/nav/imgbed-library-token:ro"
      - "${NAV_SECRETS_DIR:?set NAV_SECRETS_DIR to the release-local secrets directory}/web-push-vapid-private-key:/run/secrets/nav/web-push-vapid-private-key:ro"
      - "${NAV_SECRETS_DIR:?set NAV_SECRETS_DIR to the release-local secrets directory}/smtp-password:/run/secrets/nav/smtp-password:ro"
      - "${NAV_SECRETS_DIR:?set NAV_SECRETS_DIR to the release-local secrets directory}/imap-password:/run/secrets/nav/imap-password:ro"
      - "${NAV_SECRETS_DIR:?set NAV_SECRETS_DIR to the release-local secrets directory}/email-encryption-key:/run/secrets/nav/email-encryption-key:ro"
      - "${NAV_INTEGRATIONS_DIR:-/etc/nav/integrations}:${NAV_INTEGRATIONS_DIR:-/etc/nav/integrations}"
      - nav-model-cache:/var/cache/nav-models

  nav-mail-worker:
    image: "domo-nav-api:${NAV_RELEASE_SHA:-development}"
    container_name: nav-mail-worker
    restart: unless-stopped
    logging: *nav-logging
    depends_on:
      nav-postgres:
        condition: service_healthy
      nav-api:
        condition: service_healthy
    env_file:
      - ./api/.env
    environment:
      NODE_ENV: production
      NAV_EMAIL_RUNTIME_ROLE: worker
      NAV_MANAGED_INTEGRATIONS_DIR: "${NAV_INTEGRATIONS_DIR:-/etc/nav/integrations}"
      NAV_MAIL_WORKER_HEARTBEAT_FILE: /tmp/nav-mail-worker-heartbeat.json
      NAV_MAIL_WORKER_POOL_WAIT_ALERT_SECONDS: ${NAV_MAIL_WORKER_POOL_WAIT_ALERT_SECONDS:-60}
    command: ["node", "src/mailWorker.js"]
    healthcheck:
      test: ["CMD", "node", "scripts/checkMailWorkerHealth.js"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - "${NAV_SECRETS_DIR:?set NAV_SECRETS_DIR to the release-local secrets directory}/cliproxy-api-key:/run/secrets/nav/cli-proxy-api-key:ro"
      - "${NAV_SECRETS_DIR:?set NAV_SECRETS_DIR to the release-local secrets directory}/imap-password:/run/secrets/nav/imap-password:ro"
      - "${NAV_SECRETS_DIR:?set NAV_SECRETS_DIR to the release-local secrets directory}/email-encryption-key:/run/secrets/nav/email-encryption-key:ro"
      - "${NAV_INTEGRATIONS_DIR:-/etc/nav/integrations}:${NAV_INTEGRATIONS_DIR:-/etc/nav/integrations}:ro"

volumes:
  nav-model-cache:
