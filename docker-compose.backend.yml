services:
  nav-postgres:
    image: postgres:16-alpine
    container_name: nav-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nav
      POSTGRES_USER: nav
      POSTGRES_PASSWORD: nav_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nav-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nav -d nav"]
      interval: 10s
      timeout: 5s
      retries: 10

  nav-api:
    build:
      context: ./api
    container_name: nav-api
    restart: unless-stopped
    depends_on:
      nav-postgres:
        condition: service_healthy
    env_file:
      - ./api/.env
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  nav-postgres-data:
